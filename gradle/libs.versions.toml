[versions]
jetbrains-annotations = "[24.0,26.1)"
junit = "5.14.+"
log4j = "[2.17.1,3.0.0)"
lombok = "1.18.+"
message-format = "[0.20,0.21)"
slf4j = "[2.0.0,2.1.0)"
logback = "[1.3.0,1.4.0)"
spring-framework = "[5.3.0,6.0.0)"

[libraries]
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring-framework" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring-framework" }
message-format = { module = "de.sayayi.lib:message-format", version.ref = "message-format" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

