[versions]
# spring method logging version
spring-method-logging = '0.6.0-SNAPSHOT'

jetbrains-annotations = { require = "[16.0,26.2)", prefer = "26.1.0" }
junit = "6.1.+"
log4j = { require = "[2.13.0,3.0.0)", prefer = "2.26.1" }
lombok = "1.18.+"
message-format = { require = "[0.23,0.24)", prefer = "0.23.0" }
slf4j = { require = "[1.7.0,2.1.0)", prefer = "2.0.7" }
logback = { require = "[1.3.0,1.6.0)", prefer = "1.3.16" }
spring-framework = { require = "[5.3.26,8.0.0)", reject = [ "[6.0.0,6.0.5)" ], prefer = "5.3.39" }
commons-logging = "1.3.6"
jboss-logging = { require = "[3.3.2,4.0.0)", prefer = "3.6.3.Final" }
aspectj = { require = "[1.9.21.1,2.0)", prefer = "1.9.26" }
tinylog = { require = "[2.0.0,2.9)", prefer = "2.8.1" }

[libraries]
aspectj-runtime = { module = "org.aspectj:aspectjrt", version.ref = "aspectj" }
commons-logging = { module = "commons-logging:commons-logging", version.ref = "commons-logging" }
aspectj-tools = { module = "org.aspectj:aspectjtools", version.ref = "aspectj" }
aspectj-weaver = { module = "org.aspectj:aspectjweaver", version.ref = "aspectj" }
jboss-logging = { module = "org.jboss.logging:jboss-logging", version.ref = "jboss-logging" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
tinylog-api = { module = "org.tinylog:tinylog-api", version.ref = "tinylog" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring-framework" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring-framework" }
message-format = { module = "de.sayayi.lib:message-format", version.ref = "message-format" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
