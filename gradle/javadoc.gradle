// the compile classpath is resolved when the javadoc task is executed, not when the build is configured
def compileClasspathRoot = configurations.compileClasspath.incoming.resolutionResult.rootComponent


javadoc {
  title = "Spring Method Logging Extension ${version}"

  doFirst {
    def versions = [:]
    def visited = [] as Set
    def pending = [ compileClasspathRoot.get() ]

    while(pending) {
      def component = pending.pop()

      if (visited.add(component.id)) {
        if (component.moduleVersion != null)
          versions.putIfAbsent(component.moduleVersion.name, component.moduleVersion.version)

        for(def dependency: component.dependencies)
          if (dependency instanceof ResolvedDependencyResult)
            pending << dependency.selected
      }
    }

    def linkVersion = { String name ->
      if (!versions.containsKey(name))
        throw new GradleException("Module '${name}' not found on the compile classpath")

      versions[name]
    }

    (options as StandardJavadocDocletOptions).with {
      linksOffline "https://javadoc.io/doc/org.jetbrains/annotations/${linkVersion('annotations')}/",
                   'gradle/javadocs/jetbrains-annotations'
      linksOffline "https://javadoc.io/doc/de.sayayi.lib/message-format/${linkVersion('message-format')}/",
                   'gradle/javadocs/message-format'
      linksOffline "https://javadoc.io/doc/org.springframework/spring-beans/${linkVersion('spring-beans')}/",
                   'gradle/javadocs/spring-beans'
      linksOffline "https://javadoc.io/doc/org.springframework/spring-context/${linkVersion('spring-context')}/",
                   'gradle/javadocs/spring-context'
      linksOffline "https://javadoc.io/doc/org.springframework/spring-core/${linkVersion('spring-core')}/",
                   'gradle/javadocs/spring-core'
    }
  }

  (options as StandardJavadocDocletOptions).with {
    encoding = 'UTF-8'

    group('Spring Method Logging', [
        'de.sayayi.lib.methodlogging',
        'de.sayayi.lib.methodlogging.annotation',
        'de.sayayi.lib.methodlogging.aspectj',
        'de.sayayi.lib.methodlogging.internal',
        'de.sayayi.lib.methodlogging.logger'
    ])

    noQualifiers 'java.util', 'java.lang'

    addStringOption('Xdoclint:-missing', '-quiet')
    addStringOption('-show-module-contents', 'api')
  }
}
