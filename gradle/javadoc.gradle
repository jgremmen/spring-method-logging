ext.resolveVersion = { artifactName ->
  configurations
      .compileClasspath
      .resolvedConfiguration
      .resolvedArtifacts
      .find { it.name == artifactName }
      .moduleVersion.id.version
}


javadoc {
  title = "Spring Method Logging Extension ${version}"

  (options as StandardJavadocDocletOptions).with {
    linksOffline "https://javadoc.io/doc/org.jetbrains/annotations/${resolveVersion('annotations')}/",
                 'gradle/javadocs/jetbrains-annotations'
    linksOffline "https://javadoc.io/doc/de.sayayi.lib/message-format/${resolveVersion('message-format')}/",
                 'gradle/javadocs/message-format'
    linksOffline "https://javadoc.io/doc/org.springframework/spring-beans/${resolveVersion('spring-beans')}/",
                 'gradle/javadocs/spring-beans'
    linksOffline "https://javadoc.io/doc/org.springframework/spring-context/${resolveVersion('spring-context')}/",
                 'gradle/javadocs/spring-context'
    linksOffline "https://javadoc.io/doc/org.springframework/spring-core/${resolveVersion('spring-core')}/",
                 'gradle/javadocs/spring-core'

    encoding = 'UTF-8'

    group('Spring Method Logging', [
        'de.sayayi.lib.methodlogging',
        'de.sayayi.lib.methodlogging.annotation',
        'de.sayayi.lib.methodlogging.internal',
        'de.sayayi.lib.methodlogging.logger'
    ])

    noQualifiers 'java.util', 'java.lang'

    addStringOption('Xdoclint:-missing', '-quiet')
    addStringOption('-show-module-contents', 'api')
  }

  failOnError = false
}
