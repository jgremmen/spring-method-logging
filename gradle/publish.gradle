// do not reference by id in build.gradle because it will not respect the build directory setting
apply plugin: 'org.danilopianini.publish-on-central'


publishOnCentral {
  repoOwner = 'jgremmen'

  projectLongName = 'Spring Method Logging'
  projectDescription = 'Spring Method Logging Extension'

  licenseName = 'Apache License, Version 2.0'
  licenseUrl = 'https://www.apache.org/licenses/LICENSE-2.0'

  projectUrl = 'https://github.com/jgremmen/spring-method-logging'
  scmConnection = 'scm:git:git://github.com/jgremmen/spring-method-logging.git'
}


def snapshot = version.toString().endsWith('-SNAPSHOT')


publishing {
  publications {
    withType(MavenPublication).configureEach {
      pom {
        inceptionYear = '2022'

        url = "https://lib.sayayi.de/spring-method-logging/"

        withXml {
          // compile only dependencies, including the optional logging frameworks, are not required at runtime
          def optionalModules = configurations
              .compileOnlyApi
              .allDependencies
              .findAll { it instanceof ExternalModuleDependency }
              .collect { "${it.group}:${it.name}".toString() }
              .toSet()

          // Maven has no preferred version within a range; publish the preferred version.
          // The range is kept in the Gradle module metadata
          def preferredVersions = [ configurations.api, configurations.compileOnlyApi ]
              .collectMany { it.allDependencies }
              .findAll { it instanceof ExternalModuleDependency && it.versionConstraint.preferredVersion }
              .collectEntries { [ "${it.group}:${it.name}".toString(), it.versionConstraint.preferredVersion ] }

          asNode().dependencies[0]?.dependency?.each { dependency ->
            def module = "${dependency.groupId.text()}:${dependency.artifactId.text()}".toString()

            def preferredVersion = preferredVersions[module]
            if (preferredVersion)
              dependency.version.each { it.value = preferredVersion }

            if (module in optionalModules)
              dependency.appendNode('optional', 'true')
          }
        }

        developers {
          developer {
            id = 'jgremmen'
            name = 'Jeroen Gremmen'
            email = 'jeroen.gremmen@sayayi.de'
          }
        }
      }
    }
  }

  if (snapshot)
  {
    repositories {
      maven {
        name = 'mavenCentralSnapshot'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'

        mavenContent {
          snapshotsOnly()
        }

        credentials {
          username = rootProject.findProperty('mavenCentralPortalUsername')
          password = rootProject.findProperty('mavenCentralPortalPassword')
        }
      }
    }
  }
}


tasks.register('release-artifacts') {
  group = 'release'
  description = "Release ${project.name} ${snapshot ? 'snapshot ' : ''}artifacts to Maven Central Repository."

  inputs.property('snapshot', snapshot)

  dependsOn 'publishOSSRHPublicationToProjectLocalRepository'

  if (snapshot)
    dependsOn 'publishOSSRHPublicationToMavenCentralSnapshotRepository'
  else
  {
    dependsOn 'zipMavenCentralPortalPublication'
    dependsOn 'validateMavenCentralPortalPublication'
    dependsOn 'releaseMavenCentralPortalPublication'
  }
}


tasks.named('zipMavenCentralPortalPublication') {
  mustRunAfter 'publishOSSRHPublicationToProjectLocalRepository'
}


tasks.configureEach {
  if (name.endsWith('ToMavenLocal') || (snapshot && name.contains('MavenCentralPortal')))
    group = null
}
