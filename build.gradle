import java.nio.file.Files
import java.nio.file.StandardCopyOption


plugins {
  id 'java-library'
  id 'com.adarshr.test-logger' version '4.0.0'
}


description = 'Method Logging Extension for Spring'
group = 'de.sayayi.lib'
version = libs.versions.spring.method.logging.get()


layout.buildDirectory = '.build'


configurations {
  optionalApi
  ajc

  compileOnlyApi.extendsFrom(optionalApi)
}


java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }

  withSourcesJar()
  withJavadocJar()
}


interface InjectedExecOperations {
  @Inject ExecOperations getExecOperations()
}


compileJava {
  // the annotation style aspect compiled by javac lacks the aspectOf() method required by compile-time weaving;
  // let ajc complete the aspect, as with aspects compiled by ajc directly
  def execOperations = objects.newInstance(InjectedExecOperations).execOperations
  def ajcLauncher = javaToolchains.launcherFor(java.toolchain)
  def ajcClasspath = configurations.ajc
  def aspectClasspath = classpath
  def aspectClass = 'de/sayayi/lib/methodlogging/aspectj/MethodLoggingAspect.class'

  doLast {
    def classesDir = destinationDirectory.get().asFile
    def inDir = new File(temporaryDir, 'ajc-in')
    def outDir = new File(temporaryDir, 'ajc-out')

    inDir.deleteDir()
    outDir.deleteDir()

    def aspectIn = new File(inDir, aspectClass)
    aspectIn.parentFile.mkdirs()
    Files.copy(new File(classesDir, aspectClass).toPath(), aspectIn.toPath())

    execOperations.javaexec {
      executable = ajcLauncher.get().executablePath.asFile
      classpath = ajcClasspath
      mainClass = 'org.aspectj.tools.ajc.Main'
      args '-21', '-Xlint:ignore', '-inpath', inDir, '-classpath', (aspectClasspath + files(classesDir)).asPath, '-d', outDir
    }

    Files.copy(
        new File(outDir, aspectClass).toPath(),
        new File(classesDir, aspectClass).toPath(),
        StandardCopyOption.REPLACE_EXISTING)
  }
}


compileTestJava {
  options.debugOptions.debugLevel = 'lines,vars,source'
  options.compilerArgs = [ '-parameters' ]
}


test {
  useJUnitPlatform()

  // provider for log4j-api
  systemProperty 'log4j2.loggerContextFactory', 'org.apache.logging.log4j.simple.SimpleLoggerContextFactory'

  // module path used by ModulePathTest
  doFirst {
    systemProperty 'methodlogging.modulePath',
        (sourceSets.main.output.classesDirs + configurations.runtimeClasspath).asPath
  }
}


testlogger {
  theme = 'mocha'
  slowThreshold = 2500
}


repositories {
  mavenCentral()
}


dependencies {
  // java
  compileOnlyApi libs.jetbrains.annotations

  optionalApi libs.slf4j.api
  optionalApi libs.log4j.api
  optionalApi libs.logback.classic
  optionalApi libs.tinylog.api
  optionalApi libs.jboss.logging
  optionalApi libs.aspectj.runtime

  ajc libs.aspectj.tools

  api libs.spring.context
  api libs.message.format


  // test
  testAnnotationProcessor libs.lombok

  testCompileOnly libs.jetbrains.annotations
  testCompileOnly libs.lombok

  testImplementation libs.junit.jupiter.api
  testImplementation libs.junit.jupiter.params
  testImplementation libs.spring.test
  testImplementation libs.aspectj.tools
  testImplementation libs.log4j.api
  testImplementation libs.logback.classic

  testRuntimeOnly libs.aspectj.weaver

  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly libs.junit.platform.launcher
}


tasks.withType(Jar).configureEach {
  reproducibleFileOrder = true

  manifest {
    attributes(
        'Implementation-Vendor': 'Jeroen Gremmen',
        'Implementation-Vendor-Id': 'de.sayayi',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Created-By': System.getProperty('java.version'),
        'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ss')
    )
  }

  metaInf {
    from files('LICENSE')
  }

  dependsOn test
}


apply from: file('gradle/javadoc.gradle')
apply from: file('gradle/publish.gradle')


clean {
  delete layout.projectDirectory.dir('build')
}


wrapper {
  distributionType = Wrapper.DistributionType.BIN
}
