import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.time.Instant


plugins {
  id 'java-library'
  id 'com.adarshr.test-logger' version '4.0.0'
}


description = 'Method Logging Extension for Spring'
group = 'de.sayayi.lib'
version = libs.versions.spring.method.logging.get()


layout.buildDirectory = '.build'


configurations {
  optionalApi
  ajc

  compileOnlyApi.extendsFrom(optionalApi)

  // spring-jcl and commons-logging both provide the JCL packages
  compileClasspath.exclude group: 'org.springframework', module: 'spring-jcl'
}


java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }

  withSourcesJar()
  withJavadocJar()
}


interface InjectedExecOperations {
  @Inject ExecOperations getExecOperations()
}


compileJava {
  // the annotation style aspect compiled by javac lacks the aspectOf() method required by compile-time weaving;
  // let ajc complete the aspect, as with aspects compiled by ajc directly
  def execOperations = objects.newInstance(InjectedExecOperations).execOperations
  def ajcLauncher = javaToolchains.launcherFor(java.toolchain)
  def ajcClasspath = configurations.ajc
  def aspectClasspath = classpath
  def aspectClass = 'de/sayayi/lib/methodlogging/aspectj/MethodLoggingAspect.class'

  doLast {
    def classesDir = destinationDirectory.get().asFile
    def inDir = new File(temporaryDir, 'ajc-in')
    def outDir = new File(temporaryDir, 'ajc-out')

    inDir.deleteDir()
    outDir.deleteDir()

    def aspectIn = new File(inDir, aspectClass)
    aspectIn.parentFile.mkdirs()
    Files.copy(new File(classesDir, aspectClass).toPath(), aspectIn.toPath())

    execOperations.javaexec {
      executable = ajcLauncher.get().executablePath.asFile
      classpath = ajcClasspath
      mainClass = 'org.aspectj.tools.ajc.Main'
      args '-21', '-Xlint:ignore', '-inpath', inDir, '-classpath', (aspectClasspath + files(classesDir)).asPath, '-d', outDir
    }

    Files.copy(
        new File(outDir, aspectClass).toPath(),
        new File(classesDir, aspectClass).toPath(),
        StandardCopyOption.REPLACE_EXISTING)
  }
}


compileTestJava {
  options.debugOptions.debugLevel = 'lines,vars,source'
  options.compilerArgs = [ '-parameters' ]
}


tasks.withType(Test).configureEach {
  useJUnitPlatform()

  // provider for log4j-api
  systemProperty 'log4j2.loggerContextFactory', 'org.apache.logging.log4j.simple.SimpleLoggerContextFactory'

  // module path used by ModulePathTest; the runtime classpath of the library is set by each test task
  doFirst {
    //noinspection SpellCheckingInspection
    systemProperty 'methodlogging.modulePath',
        (sourceSets.main.output.classesDirs + (ext.modulePathRuntimeClasspath as FileCollection)).asPath
  }
}


test {
  ext.modulePathRuntimeClasspath = configurations.runtimeClasspath
}


// classpath like the given classpath, with the versions of the given groups forced to the given version ranges
def forcedVersionClasspath = { String classpathName, Map<String,String> groupVersions, Configuration classpath,
                               List<Configuration> declarations ->
  configurations.create(classpathName) {
    canBeConsumed = false
    extendsFrom(*declarations)

    attributes { attributes ->
      classpath.attributes.keySet().each {
        attributes.attribute(it, classpath.attributes.getAttribute(it))
      }
    }

    resolutionStrategy {
      eachDependency {
        if (groupVersions.containsKey(requested.group))
          useVersion groupVersions[requested.group]
      }

      componentSelection.all {
        if (groupVersions.containsKey(candidate.group) && candidate.version =~ /-(M|RC)\d+$/)
          reject('pre-release')
      }
    }
  }
}


def springTaskVersions = [
  spring6: [
    description: 'Spring Framework 6',
    groupVersions: [ 'org.springframework': '[6.0.0,7.0.0)' ]
  ],
  spring7: [
    description: 'Spring Framework 7 and Logback 1.5',
    groupVersions: [
        'org.springframework': '[7.0.0,8.0.0)',
        'ch.qos.logback': '[1.5.0,1.6.0)'
    ]
  ],
  // minimum supported versions; Spring Framework 5.3.26 and 6.0.5 are the first versions reading Java 21 class files
  spring5Minimum: [
    description: 'the minimum supported versions of Spring Framework 5 and the logging frameworks',
    groupVersions: [
        'org.springframework': '5.3.26',
        'ch.qos.logback': '1.3.0',
        'org.apache.logging.log4j': '2.13.0',
        'org.aspectj': '1.9.21.1'
    ]
  ],
  spring6Minimum: [
    description: 'the minimum supported versions of Spring Framework 6 and the logging frameworks',
    groupVersions: [
        'org.springframework': '6.0.5',
        'ch.qos.logback': '1.3.0',
        'org.apache.logging.log4j': '2.13.0',
        'org.aspectj': '1.9.21.1'
    ]
  ],
  spring7Minimum: [
    description: 'the minimum supported versions of Spring Framework 7 and the logging frameworks',
    groupVersions: [
        'org.springframework': '7.0.0',
        'ch.qos.logback': '1.5.0',
        // commons-logging, used by Spring Framework 7, requires Log4j API 2.15.0
        'org.apache.logging.log4j': '2.15.0',
        'org.aspectj': '1.9.21.1'
    ]
  ]
]

def springTests = springTaskVersions.collect { name, springTask ->
  def groupVersions = springTask.groupVersions as Map<String,String>
  def springRuntimeClasspath = forcedVersionClasspath(
      "${name}RuntimeClasspath",
      groupVersions,
      configurations.runtimeClasspath,
      [ configurations.implementation, configurations.runtimeOnly ])
  def springTestRuntimeClasspath = forcedVersionClasspath(
      "${name}TestRuntimeClasspath",
      groupVersions,
      configurations.testRuntimeClasspath,
      [ configurations.testImplementation, configurations.testRuntimeOnly ])

  tasks.register("test${name.capitalize()}", Test) {
    description = "Runs the tests with ${springTask.description}."
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.output + sourceSets.main.output + springTestRuntimeClasspath

    ext.modulePathRuntimeClasspath = springRuntimeClasspath
  }
}

test.finalizedBy springTests
springTests.collate(2, 1, false).each { previous, next ->
  next.configure {
    mustRunAfter previous
  }
}


testlogger {
  theme = 'mocha'
  slowThreshold = 2500
}


repositories {
  mavenCentral()
}


dependencies {
  // java
  compileOnlyApi libs.jetbrains.annotations

  optionalApi libs.slf4j.api
  optionalApi libs.log4j.api
  optionalApi libs.logback.classic
  optionalApi libs.tinylog.api
  optionalApi libs.jboss.logging
  optionalApi libs.aspectj.runtime

  ajc libs.aspectj.tools

  // compile against the JCL module of Spring 7 (see module-info)
  compileOnly libs.commons.logging

  api libs.spring.context
  api libs.message.format


  // test
  testAnnotationProcessor libs.lombok

  testCompileOnly libs.jetbrains.annotations
  testCompileOnly libs.lombok

  testImplementation libs.junit.jupiter.api
  testImplementation libs.junit.jupiter.params
  testImplementation libs.spring.test
  testImplementation libs.aspectj.tools
  testImplementation libs.log4j.api
  testImplementation libs.logback.classic

  testRuntimeOnly libs.aspectj.weaver

  testRuntimeOnly libs.junit.jupiter.engine
  testRuntimeOnly libs.junit.platform.launcher
}


// commit date of HEAD; empty if git is not installed or the project is not a git repository
def commitDate = providers.provider {
  try {
    def timestamp = providers
        .exec {
          commandLine 'git', 'log', '-1', '--format=%ct'
          ignoreExitValue = true
        }
        .standardOutput.asText.get().trim()

    return timestamp ? Instant.ofEpochSecond(timestamp as long).toString() : ''
  } catch(Exception ignored) {
    // git cannot be started
    return ''
  }
}


tasks.withType(Jar).configureEach {
  reproducibleFileOrder = true
  preserveFileTimestamps = false

  manifest {
    def manifestAttributes = [
        'Implementation-Vendor': 'Jeroen Gremmen',
        'Implementation-Vendor-Id': 'de.sayayi',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Created-By': System.getProperty('java.version')
    ]

    def builtDate = commitDate.get()
    if (builtDate)
      manifestAttributes['Built-Date'] = builtDate

    attributes(manifestAttributes)
  }

  metaInf {
    from files('LICENSE')
  }

  dependsOn tasks.withType(Test)
}


apply from: file('gradle/javadoc.gradle')
apply from: file('gradle/publish.gradle')


clean {
  delete layout.projectDirectory.dir('build')
}


wrapper {
  distributionType = Wrapper.DistributionType.BIN
}
